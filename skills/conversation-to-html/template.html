<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root { --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3e; --text: #e2e8f0; --muted: #8892a4; --accent: #7c6af7; --green: #4ade80; --red: #f87171; --yellow: #fbbf24; --code-bg: #12141c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.6; padding: 2rem; }
  .header { border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 2rem; }
  .header h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); }
  .meta { color: var(--muted); font-size: 0.8rem; margin-top: 0.4rem; display: flex; gap: 1.5rem; }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge-summary { background: #7c6af722; color: var(--accent); border: 1px solid #7c6af740; }
  .badge-diff { background: #4ade8022; color: var(--green); border: 1px solid #4ade8040; }
  .badge-mixed { background: #fbbf2422; color: var(--yellow); border: 1px solid #fbbf2440; }
  section { margin-bottom: 2rem; }
  h2 { font-size: 1rem; font-weight: 600; color: var(--accent); margin-bottom: 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border); }
  h3 { font-size: 0.9rem; font-weight: 600; margin: 1rem 0 0.4rem; }
  p { margin-bottom: 0.75rem; color: var(--text); }
  ul, ol { padding-left: 1.4rem; margin-bottom: 0.75rem; }
  li { margin-bottom: 0.3rem; }
  code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 3px; padding: 0.1rem 0.35rem; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.82em; color: #a5f3fc; }
  pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; overflow-x: auto; margin-bottom: 1rem; }
  pre code { background: none; border: none; padding: 0; color: var(--text); font-size: 0.82em; }
  .diff-file { margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .diff-filename { background: var(--surface); padding: 0.5rem 0.75rem; font-family: monospace; font-size: 0.82em; color: var(--muted); border-bottom: 1px solid var(--border); }
  .diff-line { padding: 0.15rem 0.75rem; font-family: 'JetBrains Mono', monospace; font-size: 0.82em; white-space: pre; }
  .diff-add { background: #4ade8012; color: var(--green); }
  .diff-del { background: #f8717112; color: var(--red); }
  .diff-ctx { color: var(--muted); }
  .diff-hunk { color: var(--accent); background: #7c6af710; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
  .tag { display: inline-block; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 0.1rem 0.45rem; font-size: 0.75rem; color: var(--muted); margin: 0.2rem; }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.75rem; }
</style>
</head>
<body>
<div class="header">
  <h1>{{TITLE}}</h1>
  <div class="meta">
    <span>{{DATE}}</span>
    <span>{{PROJECT}}</span>
    <span class="badge {{BADGE_CLASS}}">{{TYPE}}</span>
  </div>
</div>

{{BODY}}

<footer>Generated by Claude Code · {{DATE}}</footer>
</body>
</html>
